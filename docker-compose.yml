# ==============================================================================
# ai-youtube-automation — base infrastructure stack
#
# This file holds configuration common to every environment. Environment
# differences (published ports, TLS, resource limits, cookie security) live
# in docker-compose.override.yml (auto-loaded for local dev) and
# docker-compose.prod.yml (explicit, passed with -f for production).
#
# Network topology — see docs/architecture/repository-architecture.md and
# docs/deployment/oracle-deployment-assumptions.md#topology-starter-not-final
# for the full rationale:
#   gateway      caddy, n8n, approval-api        — the only network with any
#                                                   path to the internet-facing proxy
#   application  n8n, renderer, approval-api      — internal service-to-service calls
#   data         postgres, redis, minio, n8n,     — internal:true — no route out of
#                renderer, minio-init               the Docker host at all
#
# n8n and renderer sit on `data` too: n8n needs direct Postgres/Redis access,
# and renderer will need direct MinIO access once real render jobs write
# output (not implemented yet — see apps/renderer/README.md). Neither one
# is ever on `data` in place of proper isolation for postgres/redis/minio —
# those three are never attached to `gateway`, and `data` itself has no
# route to the internet (internal: true) or to the proxy.
#
# Usable today:
#   docker compose config                              # validate merged config
#   docker compose up -d                                # dev (auto-merges override.yml)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   # prod
# ==============================================================================

name: ai-youtube-automation

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  gateway:
    name: ai-youtube-gateway
  application:
    name: ai-youtube-application
  data:
    name: ai-youtube-data
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  n8n-data:
  caddy-data:
  caddy-config:

services:
  postgres:
    image: postgres:16.9@sha256:ddfe3e8713e3ee5b8f286082cb12512488dfbf3f5a1ecb0b74a42e6055af0a5f
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      # Bootstrap/admin superuser only, from Step 3 onward — used solely by
      # database/bootstrap/ to create the real roles below. Never used for
      # routine migration or application traffic. See
      # docs/architecture/database-architecture.md#role-permission-model.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by database/bootstrap/0000_create_roles_and_databases.sh.
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_READONLY_DB_USER: ${APP_READONLY_DB_USER}
      APP_READONLY_DB_PASSWORD: ${APP_READONLY_DB_PASSWORD}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      # UTF8 encoding with C collation: predictable byte-order sort, valid
      # and common combination. Revisit if/when channel-language-aware text
      # sorting (accented characters etc.) becomes a real requirement — see
      # docs/architecture/arm64-compatibility.md known limitations.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Cluster bootstrap only (roles/databases) — real schema migrations
      # are applied by the `migrate` service below, not this mechanism.
      # See database/bootstrap/README.md.
      - ./database/bootstrap:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 100mb
      --maxmemory-policy noeviction
      --appendonly yes
    environment:
      # Lets `redis-cli` (used by the healthcheck) authenticate without the
      # password appearing in the container's process arguments.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # One-shot: creates the application bucket, then exits. Not a long-running
  # service — `restart: "no"` is deliberate.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${STORAGE_ACCESS_KEY}:${STORAGE_SECRET_KEY}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc mb --ignore-existing local/${STORAGE_BUCKET}"]
    networks: [data]
    restart: "no"
    logging: *default-logging

  # Schema migrations. `profiles: [tools]` keeps it out of normal
  # `docker compose up` — it's invoked on demand via `docker compose run
  # --rm migrate <subcommand>` (see scripts/db-migrate.sh etc.). dbmate is
  # a single static binary with an official multi-arch (amd64/arm64)
  # image — see docs/architecture/arm64-compatibility.md#migration-tooling.
  migrate:
    image: amacneil/dbmate:2.34.1@sha256:3298bdfcb651af608e06d2e13ae12398c4056e5326d38ef31885973d83248d9c
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${MIGRATOR_DB_USER}:${MIGRATOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # dbmate's default migrations/schema paths are the *relative* path
      # "./db/migrations" from wherever it runs — not configurable via
      # working_dir alone (setting working_dir: /db made it look for
      # /db/db/migrations). Overriding both explicitly is more robust
      # than relying on that convention anyway.
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_SCHEMA_FILE: /db/schema.sql
    volumes:
      - ./database:/db
    networks: [data]
    logging: *default-logging

  # Automated database test suite (see database/tests/). Same
  # tools-profile pattern as `migrate` — never started by `docker compose
  # up`, only via `scripts/db-test.sh`.
  db-test:
    build:
      context: ./database/tests
      dockerfile: Dockerfile
    image: ai-youtube-automation/db-test:local
    profiles: ["tools"]
    environment:
      APP_DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATOR_DATABASE_URL: postgres://${MIGRATOR_DB_USER}:${MIGRATOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      READONLY_DATABASE_URL: postgres://${APP_READONLY_DB_USER}:${APP_READONLY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      # Migrations mounted read-only purely so the test suite can check
      # the applied-migrations ledger against the actual file list — the
      # image itself never needs to reach the internet at runtime.
      - ./database/migrations:/migrations:ro
    networks: [data]
    logging: *default-logging

  n8n:
    image: n8nio/n8n:2.32.2@sha256:119afa425cc1ac3e62823c65aae16fcee409ef4c94555ebab3a9dff6eccb9073
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT}
      # n8n gets its own database, owned by its own role (n8n_app) — see
      # database/bootstrap/0000_create_roles_and_databases.sh. n8n manages
      # its own internal schema/migrations itself; it is never given
      # access to the application database.
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Single instance for now (EXECUTIONS_MODE=regular). Redis connection
      # is wired up so switching to EXECUTIONS_MODE=queue plus an n8n-worker
      # service later is a config change, not a re-architecture.
      EXECUTIONS_MODE: ${N8N_EXECUTIONS_MODE:-regular}
      QUEUE_BULL_REDIS_HOST: ${REDIS_HOST}
      QUEUE_BULL_REDIS_PORT: ${REDIS_PORT}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      # Large media outputs must not round-trip through Postgres as base64 —
      # filesystem-backed binary data, on the persistent n8n-data volume.
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /home/node/.n8n/binaryData
      N8N_RUNNERS_ENABLED: "true"
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      N8N_LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [gateway, application, data]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  approval-api:
    build:
      context: ./apps/approval-api
      dockerfile: Dockerfile
    image: ai-youtube-automation/approval-api:local
    environment:
      PORT: "3000"
      SERVICE_NAME: approval-api
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
    networks: [gateway, application]
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *default-logging
    # No `ports:` in base or prod — reached via the proxy. Dev-only direct
    # access, if enabled, lives in docker-compose.override.yml.

  renderer:
    build:
      context: ./apps/renderer
      dockerfile: Dockerfile
    image: ai-youtube-automation/renderer:local
    environment:
      PORT: "3000"
      SERVICE_NAME: renderer
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}
      RENDERER_MAX_CONCURRENCY: ${RENDERER_MAX_CONCURRENCY:-1}
    networks: [application, data]
    stop_grace_period: 15s
    restart: unless-stopped
    logging: *default-logging
    # No `ports:` anywhere, ever — the renderer must never be reachable
    # except from other containers on the `application`/`data` networks.

  proxy:
    image: caddy:2.11.4@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [gateway]
    depends_on:
      n8n:
        condition: service_healthy
      approval-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/caddy-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    # Caddyfile mount, and the only published ports in this whole stack,
    # come from docker-compose.override.yml (dev) or docker-compose.prod.yml.
