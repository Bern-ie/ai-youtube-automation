# ==============================================================================
# ai-youtube-automation — Compose skeleton
#
# Status: STRUCTURE ONLY. Nothing below is runnable yet — every service is
# commented out. This file exists so the intended topology is documented and
# reviewable before infrastructure implementation begins (a later phase).
#
# Intended topology (single Oracle Ampere A1 VM for the initial launch):
#   - postgres, redis, minio  : internal only, never publish ports publicly
#   - n8n                     : internal in prod, reached only via the proxy
#   - renderer, approval-api  : internal only, no published ports
#   - admin                   : internal in prod, reached only via the proxy
#   - proxy (Caddy)           : the ONLY service with published 80/443
#
# All custom-built services (renderer, approval-api, admin) must be built
# multi-arch via Buildx — see docs/architecture/arm64-compatibility.md and
# docs/operations/development-commands.md.
# ==============================================================================

name: ai-youtube-automation

